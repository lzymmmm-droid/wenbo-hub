<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文博Hub — 文化博物信息聚合</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: #f1f0ec;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
  }

  /* ─── Header ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
    background: rgba(241,240,236,.85);
    display: grid;
    align-items: center;
    padding: 12px 24px;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    border-bottom: 1px solid rgba(0,0,0,.04);
  }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #1a1a1a; text-decoration: none; white-space: nowrap; }
  .logo span { color: #b8452a; }

  .nav-tabs {
    display: flex; gap: 4px; background: rgba(0,0,0,.04); padding: 4px; border-radius: 14px;
    justify-self: center; flex-wrap: wrap;
  }
  .nav-tab {
    padding: 6px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
    color: #666; cursor: pointer; transition: all .15s; border: none; background: transparent; white-space: nowrap;
  }
  .nav-tab:hover { color: #333; background: rgba(0,0,0,.04); }
  .nav-tab.active { color: #1a1a1a; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 600; }

  .header-actions { display: flex; gap: 6px; align-items: center; }
  .header-actions button {
    width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: #666; transition: all .15s;
  }
  .header-actions button:hover { background: rgba(0,0,0,.06); color: #1a1a1a; }

  /* ─── Main Grid ─── */
  .main { height: calc(100vh - 65px); overflow-y: auto; padding: 20px 24px 40px; }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-thumb { background: #d0ccc4; border-radius: 3px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }

  /* ─── Section Header (省市分组) ─── */
  .section-header {
    grid-column: 1 / -1;
    font-size: 13px;
    font-weight: 700;
    color: #999;
    letter-spacing: 2px;
    padding: 20px 0 4px;
    border-bottom: 1px solid rgba(0,0,0,.06);
    margin-bottom: 0;
  }
  .section-header:first-child { padding-top: 0; }

  /* ─── Card ─── */
  .card {
    border-radius: 16px; padding: 16px; display: flex; flex-direction: column;
    height: 480px; position: relative; overflow: hidden;
  }
  .card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 16px; opacity: .15;
    background-image:
      radial-gradient(circle at 20% 50%, rgba(255,255,255,.6) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.3) 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(255,255,255,.2) 0%, transparent 45%);
  }
  .card.cat-museums { background: #e8d5c8; }
  .card.cat-industry { background: #c8d8e8; }
  .card.cat-policy { background: #c8e0d0; }
  .card.cat-kol { background: #d8cce8; }
  .card.cat-travel { background: #e8dcc0; }
  .card.cat-expo { background: #c0d8d8; }
  .card.cat-provinces { background: #d0d8c0; }

  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; position: relative; z-index: 1; }
  .card-icon {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: rgba(255,255,255,.7); backdrop-filter: blur(4px); flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 700; color: #1a1a1a; line-height: 1.2; }
  .card-meta { font-size: 11px; color: rgba(0,0,0,.5); }
  .card-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .card-actions button {
    width: 28px; height: 28px; border-radius: 6px; border: none;
    background: rgba(255,255,255,.4); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,0,0,.45); transition: all .15s; backdrop-filter: blur(4px);
  }
  .card-actions button:hover { background: rgba(255,255,255,.7); color: rgba(0,0,0,.7); }
  .card-actions .btn-star.starred { color: #e8b84a; }
  .card-actions .drag-handle {
    font-size: 14px; letter-spacing: -2px; cursor: grab;
    width: 20px; height: 28px; border-radius: 6px; border: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    color: rgba(0,0,0,.3); transition: all .15s;
  }
  .card-actions .drag-handle:hover { color: rgba(0,0,0,.6); }
  .card.dragging { opacity: .4; }
  .card.drag-over { box-shadow: 0 0 0 2px #b8452a; }
  .card.starred { outline: 2px solid #e8b84a; outline-offset: -2px; }

  /* ─── Card Body ─── */
  .card-body {
    flex: 1; overflow-y: auto; padding: 8px; border-radius: 12px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(8px); position: relative; z-index: 1;
  }
  .card-body::-webkit-scrollbar { width: 4px; }
  .card-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 2px; }

  .card-link-item {
    display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 8px;
    text-decoration: none; color: #1a1a1a; transition: background .15s; cursor: pointer;
  }
  .card-link-item:hover { background: rgba(0,0,0,.04); }
  .card-link-item .num {
    min-width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; background: rgba(0,0,0,.06); font-size: 11px; font-weight: 600;
    color: rgba(0,0,0,.4); flex-shrink: 0; margin-top: 1px;
  }
  .card-link-item .text { font-size: 13px; line-height: 1.5; flex: 1; min-width: 0; word-break: break-word; }
  .card-link-item .item-date { font-size: 11px; color: #999; white-space: nowrap; margin-left: auto; padding-top: 2px; }
  .card-link-item .item-tag { font-size: 10px; color: #888; background: rgba(0,0,0,.04); padding: 0 6px; border-radius: 4px; white-space: nowrap; margin-left: 4px; align-self: center; }

  /* ─── Shimmer (refresh animation) ─── */
  @keyframes shimmer { 0% { opacity: 1; } 50% { opacity: .5; } 100% { opacity: 1; } }
  .card-body.refreshing .card-link-item { animation: shimmer .6s ease; }

  /* ─── Empty ─── */
  .empty-state { text-align: center; padding: 60px 20px; color: #999; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ─── AI Chat ─── */
  .ai-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    width: 52px; height: 52px; border-radius: 16px;
    background: linear-gradient(135deg, #b8452a, #8B2500);
    color: #fff; border: none; cursor: pointer; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(184,69,42,.3);
    transition: all .2s;
  }
  .ai-fab:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(184,69,42,.4); }
  .ai-fab .trial-badge {
    position: absolute; top: -8px; right: -8px;
    background: #e8b84a; color: #1a1a1a; font-size: 9px; font-weight: 700;
    padding: 1px 6px; border-radius: 8px; white-space: nowrap;
    border: 2px solid #f1f0ec;
  }

  /* Chat Window */
  .ai-chat {
    position: fixed; bottom: 88px; right: 24px; z-index: 100;
    width: 380px; height: 560px; border-radius: 16px;
    background: #fff; box-shadow: 0 8px 40px rgba(0,0,0,.12);
    display: none; flex-direction: column; overflow: hidden;
    border: 1px solid rgba(0,0,0,.06);
  }
  .ai-chat.open { display: flex; }
  .ai-chat-header {
    padding: 14px 16px; background: #faf9f6; border-bottom: 1px solid #eee;
    display: flex; align-items: center; gap: 10px;
  }
  .ai-chat-header .avatar {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #b8452a, #8B2500);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
  }
  .ai-chat-header .info { flex: 1; }
  .ai-chat-header .info .name { font-size: 14px; font-weight: 600; }
  .ai-chat-header .info .status { font-size: 11px; color: #999; }
  .ai-chat-header .trial-tag {
    font-size: 10px; background: #fef3d6; color: #9a7a2a;
    padding: 2px 8px; border-radius: 6px; font-weight: 600;
  }
  .ai-chat-header .close-btn {
    width: 28px; height: 28px; border-radius: 6px; border: none;
    background: transparent; cursor: pointer; font-size: 16px;
    color: #999; display: flex; align-items: center; justify-content: center;
  }
  .ai-chat-header .close-btn:hover { background: rgba(0,0,0,.05); color: #333; }

  .ai-chat-body {
    flex: 1; overflow-y: auto; padding: 16px;
    background: #faf9f6; display: flex; flex-direction: column; gap: 12px;
  }
  .ai-chat-body::-webkit-scrollbar { width: 4px; }
  .ai-chat-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .msg { display: flex; gap: 8px; max-width: 85%; }
  .msg.ai { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6;
  }
  .msg.ai .bubble {
    background: #fff; color: #1a1a1a; box-shadow: 0 1px 3px rgba(0,0,0,.04);
    border-bottom-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #b8452a, #8B2500); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg .avatar-mini {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .msg.ai .avatar-mini { background: linear-gradient(135deg, #b8452a, #8B2500); color: #fff; }
  .msg.user .avatar-mini { background: #e8e5e0; color: #666; }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 0;
  }
  .suggestions button {
    font-size: 11px; padding: 5px 10px; border-radius: 8px; border: 1px solid #e0ddd6;
    background: #fff; color: #666; cursor: pointer; transition: all .15s;
  }
  .suggestions button:hover { border-color: #b8452a; color: #b8452a; background: #fef6f3; }

  .ai-chat-input {
    padding: 10px 12px; border-top: 1px solid #eee; display: flex; gap: 8px;
    background: #fff;
  }
  .ai-chat-input input {
    flex: 1; border: none; outline: none; font-size: 13px; padding: 8px 12px;
    border-radius: 10px; background: #f5f4f0; color: #1a1a1a;
  }
  .ai-chat-input input::placeholder { color: #bbb; }
  .ai-chat-input button {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, #b8452a, #8B2500);
    color: #fff; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .ai-chat-input button:disabled { opacity: .4; cursor: not-allowed; }

  .typing-dots span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #bbb; margin: 0 1px; animation: dotPulse 1.4s ease infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotPulse { 0%,80%,100% { transform: scale(.6); } 40% { transform: scale(1); } }

  /* ─── Mobile ─── */
  @media (max-width: 720px) {
    header { grid-template-columns: 1fr; gap: 8px; padding: 10px 12px; }
    .logo { justify-self: center; }
    .nav-tabs { justify-self: center; overflow-x: auto; max-width: 100%; }
    .header-actions { display: none; }
    .main { padding: 12px; }
    .grid { grid-template-columns: 1fr; }
    .card { height: 420px; }
    .ai-chat { width: calc(100vw - 24px); height: 60vh; bottom: 80px; right: 12px; }
  }
</style>
</head>

<header>

  <div class="header-actions">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">⬆</button>
    <button onclick="location.reload()" title="刷新">⟳</button>
  </div>
</header>

<main class="main">

<!-- AI Chat -->
<button class="ai-fab" id="aiFab" onclick="toggleChat()">

</button>

<div class="ai-chat" id="aiChat">
  <div class="ai-chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <div class="name">文博AI助手</div>
      <div class="status">在线 · 剩余 7 天试用</div>
    </div>
    <span class="trial-tag">PRO</span>
    <button class="close-btn" onclick="toggleChat()">✕</button>
  </div>
  <div class="ai-chat-body" id="chatBody">
    <div class="msg ai">
      <div class="avatar-mini">🤖</div>
      <div class="bubble">你好！我是文博AI助手，可以帮你了解博物馆资讯、展览信息、文物知识、文旅趋势等。有什么想问的？</div>
    </div>
    <div class="suggestions">
      <button onclick="sendSuggestion('最近有什么值得看的博物馆展览？')">最近有什么展览？</button>
      <button onclick="sendSuggestion('故宫最近有什么新动态？')">故宫新动态</button>
      <button onclick="sendSuggestion('2026年文博行业趋势')">行业趋势</button>
    </div>
  </div>
  <div class="ai-chat-input">
    <input id="chatInput" placeholder="输入问题..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button id="chatSend" onclick="sendMsg()">➤</button>
  </div>
</div>

// ─── Starred Sources (localStorage) ───
const STORAGE_KEY = "wenbohub_starred";
const ORDER_KEY = "wenbohub_order";
let starredSources = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

function saveStars() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...starredSources]));
}

function toggleStar(btn) {
  const card = btn.closest(".card");
  const name = card.dataset.name;
  if (starredSources.has(name)) {
    starredSources.delete(name);
    btn.classList.remove("starred");
    btn.textContent = "☆";
    card.classList.remove("starred");
  } else {
    starredSources.add(name);
    btn.classList.add("starred");
    btn.textContent = "★";
    card.classList.add("starred");
  }
  saveStars();
  // If in "starred" view and unfavorited, remove the card
  if (currentCat === "starred" && !starredSources.has(name)) {
    card.style.transition = "opacity .3s, transform .3s";
    card.style.opacity = "0";
    card.style.transform = "scale(.95)";
    setTimeout(() => render("starred"), 300);
  }
}

function getOrder() {
  try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "[]"); } catch { return []; }
}
function saveOrder(names) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(names));
}

// ─── Render Grid ───
const navTabs = document.getElementById("nav-tabs");
const grid = document.getElementById("grid");
let currentCat = "all";
let dragSourceName = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function cardHtml(s, starred, starChar, starClass) {
  return `<div class="card cat-${s.cat}${starred ? " starred" : ""}" draggable="true" data-name="${s.name}">
    <div class="card-header">
      <div class="card-icon">${s.icon}</div>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-meta" data-meta>刚刚更新</div>
      </div>
      <div class="card-actions">
        <button class="btn-star${starClass}" onclick="toggleStar(this)" title="收藏">${starChar}</button>
        <button onclick="refreshCard(this)" title="刷新">⟳</button>
        <button onclick="event.stopPropagation();window.open('${s.url}','_blank')" title="打开">↗</button>
        <span class="drag-handle" title="拖拽排序">⠿</span>
      </div>
    </div>
    <div class="card-body" data-body>
      ${(s.items || []).map((item, j) => {
        const url = item.u || s.url || "#";
        return `<a class="card-link-item" href="${url}" target="_blank">
          <span class="num">${j + 1}</span>
          <span class="text">${item.t}</span>
          ${item.date ? `<span class="item-date">${item.date}</span>` : ""}
          ${item.feed ? `<span class="item-tag">${item.feed}</span>` : ""}
        </a>`;
      }).join("")}
    </div>
  </div>`;
}

function render(catId) {
  currentCat = catId;

  // Filter
  let filtered;
  if (catId === "starred") {
    filtered = sources.filter(s => starredSources.has(s.name));
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">⭐</div><p>还没有收藏信源，点击卡片上的 ☆ 收藏</p></div>`;
      return;
    }
    filtered.sort((a, b) => (b.items?.length || 0) - (a.items?.length || 0));
  } else if (catId === "all") {
    // Starred first, then by saved order
    const starred = sources.filter(s => starredSources.has(s.name));
    const unstarred = sources.filter(s => !starredSources.has(s.name));
    const order = getOrder();
    const sortByOrder = arr => {
      const ordered = [];
      order.forEach(name => {
        const idx = arr.findIndex(s => s.name === name);
        if (idx !== -1) { ordered.push(arr[idx]); arr.splice(idx, 1); }
      });
      return [...ordered, ...arr];
    };
    filtered = [...sortByOrder(starred), ...sortByOrder(unstarred)];
    // 在已有排序基础上，按条目数降序排列（信息最多的置顶）
    filtered.sort((a, b) => (b.items?.length || 0) - (a.items?.length || 0));
  } else {
    filtered = sources.filter(s => s.cat === catId);
    // Apply saved order within category
    const order = getOrder();
    const catFiltered = [];
    order.forEach(name => {
      const idx = filtered.findIndex(s => s.name === name);
      if (idx !== -1) { catFiltered.push(filtered[idx]); filtered.splice(idx, 1); }
    });
    filtered = [...catFiltered, ...filtered];
    filtered.sort((a, b) => (b.items?.length || 0) - (a.items?.length || 0));
  }

  let html = "";
  if (catId === "provinces") {
    // 分组显示：中央机构 → 省、自治区 → 直辖市 → 特别行政区
    const regionOrder = ["central", "province", "autonomous", "municipality", "sar"];
    const regionLabels = { central: "中央机构", province: "省", autonomous: "自治区", municipality: "直辖市", sar: "特别行政区" };
    let lastHeader = null;
    regionOrder.forEach(region => {
      const group = filtered.filter(s => s.region === region);
      if (group.length === 0) return;
      // 省和自治区共用一个 header
      let header;
      if (region === "province" || region === "autonomous") header = "省、自治区";
      else header = regionLabels[region];
      if (header !== lastHeader) {
        html += `<div class="section-header">${header}</div>`;
        lastHeader = header;
      }
      group.forEach(s => {
        const starred = starredSources.has(s.name);
        const starChar = starred ? "★" : "☆";
        const starClass = starred ? " starred" : "";
        html += cardHtml(s, starred, starChar, starClass);
      });
    });
  } else {
    filtered.forEach((s, i) => {
      const starred = starredSources.has(s.name);
      const starChar = starred ? "★" : "☆";
      const starClass = starred ? " starred" : "";
      html += cardHtml(s, starred, starChar, starClass);
    });
  }
  grid.innerHTML = html;
  setupDragDrop();
}

// ─── Drag & Drop ───
function setupDragDrop() {
  const cards = grid.querySelectorAll(".card");
  cards.forEach(card => {
    card.addEventListener("dragstart", onDragStart);
    card.addEventListener("dragend", onDragEnd);
    card.addEventListener("dragover", onDragOver);
    card.addEventListener("dragleave", onDragLeave);
    card.addEventListener("drop", onDrop);
  });
}

function onDragStart(e) {
  dragSourceName = e.target.closest(".card").dataset.name;
  e.target.closest(".card").classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragSourceName);
}

function onDragEnd(e) {
  e.target.closest(".card").classList.remove("dragging");
  document.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
  dragSourceName = null;
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  const target = e.target.closest(".card");
  if (target && target.dataset.name !== dragSourceName) {
    target.classList.add("drag-over");
  }
}

function onDragLeave(e) {
  const target = e.target.closest(".card");
  if (target) target.classList.remove("drag-over");
}

function onDrop(e) {
  e.preventDefault();
  document.querySelectorAll(".card.drag-over").forEach(c => c.classList.remove("drag-over"));
  const targetCard = e.target.closest(".card");
  if (!targetCard || targetCard.dataset.name === dragSourceName) return;

  const names = Array.from(grid.querySelectorAll(".card")).map(c => c.dataset.name);
  const fromIdx = names.indexOf(dragSourceName);
  const toIdx = names.indexOf(targetCard.dataset.name);
  if (fromIdx === -1 || toIdx === -1) return;

  if (fromIdx < toIdx) {
    targetCard.parentNode.insertBefore(targetCard.parentNode.children[fromIdx], targetCard.nextSibling);
  } else {
    targetCard.parentNode.insertBefore(targetCard.parentNode.children[fromIdx], targetCard);
  }

  const newOrder = Array.from(grid.querySelectorAll(".card")).map(c => c.dataset.name);
  saveOrder(newOrder);
}

// ─── Per-card Refresh ───
function refreshCard(btn) {
  const card = btn.closest(".card");
  const body = card.querySelector("[data-body]");
  const meta = card.querySelector("[data-meta]");
  const items = Array.from(body.querySelectorAll(".card-link-item"));

  // Shuffle items
  const shuffled = shuffle(items);
  // Re-number
  shuffled.forEach((item, i) => {
    item.querySelector(".num").textContent = i + 1;
    body.appendChild(item);
  });

  // Shimmer animation
  body.classList.add("refreshing");
  setTimeout(() => body.classList.remove("refreshing"), 600);

  // Update time
  const times = ["刚刚刷新", "1分钟前更新", "2分钟前更新", "刚刚刷新"];
  meta.textContent = times[Math.floor(Math.random() * times.length)];
}

// ─── 加载 feed.json 并合并 ───
async function loadFeed() {
  try {
    const res = await fetch("data/feed.json?" + Date.now());
    const feed = await res.json();
    const feedNames = new Set();
    for (const src of feed.sources) {
      feedNames.add(src.name);
      // 替换或追加到 sources
      const idx = sources.findIndex(s => s.name === src.name);
      const entry = {
        cat: src.cat || "policy",
        icon: src.icon || "📄",
        name: src.name,
        items: (src.items || []).map(i => ({
          t: i.t,
          u: i.u || "",
          date: i.date || "",
          feed: i.feed || "",
        })),
      };
      if (idx >= 0) {
        // 保留硬编码中的 region 字段
        if (sources[idx].region) entry.region = sources[idx].region;
        sources[idx] = entry;
      } else sources.push(entry);
    }
    // 删除已不再抓取的信源（仅在 feed.json 有覆盖时）
    // 保留未在 feed 中的硬编码信源
  } catch (e) {
    console.warn("feed.json 加载失败，使用内置数据", e);
  }
}

  if (!text) return;
  input.value = "";
  appendMsg("user", text);

  const sendBtn = document.getElementById("chatSend");
  sendBtn.disabled = true;

  // Typing indicator
  const dots = document.createElement("div");
  dots.className = "msg ai";
  dots.id = "typingDots";
  dots.innerHTML = `<div class="avatar-mini">🤖</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  document.getElementById("chatBody").appendChild(dots);
  document.getElementById("chatBody").scrollTop = document.getElementById("chatBody").scrollHeight;

  setTimeout(() => {
    document.getElementById("typingDots")?.remove();
    appendMsg("ai", getAIResponse(text));
    sendBtn.disabled = false;
  }, 1000 + Math.random() * 800);
}

function sendSuggestion(text) {
  document.getElementById("chatInput").value = text;
  sendMsg();
}

function appendMsg(role, text) {
  const body = document.getElementById("chatBody");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="avatar-mini">${role === "ai" ? "🤖" : "👤"}</div><div class="bubble">${text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")}</div>`;
  // Insert before suggestions if last msg
  const suggestions = body.querySelector(".suggestions");
  if (suggestions) body.insertBefore(div, suggestions);
  else body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
</script>
</body>
</html>
